name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish font
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build and validate the release font
        run: nix develop -c nu -c 'nur release build $env.GITHUB_REF_NAME'

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: nix develop -c nu {0}
        run: |
          ^gh release create $env.GITHUB_REF_NAME \
            build/ZhongdouSansVF.ttf \
            LICENSE \
            CHANGELOG.md \
            --title $"Zhongdou Sans ($env.GITHUB_REF_NAME)" \
            --generate-notes
